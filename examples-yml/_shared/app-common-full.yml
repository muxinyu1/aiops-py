server:
  # undertow ??
  undertow:
    # HTTP post???????????-1????????????
    max-http-post-size: 1GB
    # ????????buffer,??buffer?????????IO??,????netty???????
    # ??buffer?????,???????????
    buffer-size: 512
    # ?????????
    direct-buffers: true
    threads:
      # ??IO???, ???????????,?????????, ??????CPU??????
      io: 8
      # ???????, ?????servlet??????, undertow????????????,?????????????
      worker: 256

dubbo:
  application:
    # ??qos?????????????? ????????
    qos-enable: false
  protocol:
    # ???? Triple 3.0 ??? ???????
    # ?? dubbo ????
    name: dubbo
    # dubbo ????(-1??????,?20880??)
    port: -1
    # ??dubbo????ip
    # host: 192.168.0.100
    # ??????
    # threadpool: virtual
  # ???????
  consumer:
    # ????
    timeout: 3000
  # ?????
  custom:
    # ????log
    request-log: true
    # info ???? param ???? full ??
    log-level: info

spring:
  threads:
    # ?????? ?jdk21??
    virtual:
      enabled: false
  task:
    execution:
      # ? springboot 3.5 ?? spring?????
      # ???? AsyncConfig?ThreadPoolConfig ??????????
      thread-name-prefix: async-
      # ?spring????????
      mode: force
  # ????
  messages:
    # ?????????
    basename: i18n/messages
  servlet:
    multipart:
      # ????????
      max-request-size: 20MB
      # ??????????
      max-file-size: 10MB
  mvc:
    # ???????? ?????????????
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  #jackson??
  jackson:
    # ?????
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # ?????
      INDENT_OUTPUT: false
      # ?????????
      fail_on_empty_beans: false
    deserialization:
      # ??????json???????
      fail_on_unknown_properties: false
  cloud:
    inetutils:
      # ??????ip??
      preferred-networks:
#        - 192.168
#        - 10.0
    nacos:
      discovery:
        metadata:
          # admin ??????
          username: ruoyi
          userpassword: 123456
    bus:
      id: ${spring.application.name}
      base-packages: org.dromara.**.event
  # ???? ????? kafka ?? spring-cloud-bus ??
  rabbitmq:
    host: localhost
    port: 5672
    username: ruoyi
    password: ruoyi123

  # redis???? ?????????????
  data:
    redis:
      host: localhost
      port: 6379
      # redis ??????
      password: ruoyi123
      database: 0
      # ??????
      timeout: 10000
      ssl.enabled: false

# redisson ??
redisson:
  # redis key??
  keyPrefix:
  # ?????
  threads: 4
  # Netty?????
  nettyThreads: 8
  # ?????
  singleServerConfig:
    # ?????
    clientName: ${spring.application.name}
    # ???????
    connectionMinimumIdleSize: 8
    # ?????
    connectionPoolSize: 32
    # ????????????
    idleConnectionTimeout: 10000
    # ????????????
    timeout: 3000
    # ??????????
    subscriptionConnectionPoolSize: 50

# ???? lock4j ????
lock4j:
  # ?????????????? 3000 ??
  acquire-timeout: 3000
  # ????????????? 30 ?
  expire: 30000

# ??????
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/${spring.application.name}/console.log

# ????
logging:
  level:
    org.springframework: warn
    org.apache.dubbo: error
    com.alibaba.nacos: error
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
    io.micrometer: error
    # ???? spring ?????????????? ??????? alibaba ??
    org.springframework.context.support.PostProcessorRegistrationDelegate: error
  config: classpath:logback-plus.xml

